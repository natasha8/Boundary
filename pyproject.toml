[project]
name = "boundary"
version = "0.1.0"
description = "Evidence-driven Web and API security scanner."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpcore[asyncio]>=1.0.9,<2",
]

[project.scripts]
boundary = "boundary.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "src",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
